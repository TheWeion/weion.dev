          - name: status
            label: Status badge
            type: string
            required: true
            description: "e.g. AVAILABLE, ACTIVE, STANDBY"
          - name: tagline
            label: Tagline
            type: text
            required: true
      - name: bio
        label: Bio
        type: text
        required: true
      - name: associates
        label: Known associates
        type: object
        list: true
        description: Rows in the dossier's KNOWN ASSOCIATES panel, rendered in this order.
        fields:
          - name: label
            label: Label
            type: string
            required: true
            description: "e.g. Weekly TTRPG cohort"
          - name: detail
            label: Detail
            type: string
            description: "Highlighted text after the label, e.g. Pathfinder 2e and Gumshoe. Leave blank to show only the label."
      - name: signoff
        label: Sign-off banner
        type: string
        required: true
      - name: socials
        label: Social links
        type: object
        required: true
        fields:
          - name: github
            label: GitHub URL
            type: string
            required: true
          - name: linkedin
            label: LinkedIn URL
            type: string
            required: true
          - name: email
            label: Email address
            type: string
            required: true
            description: "Just the address, e.g. you@example.com — the mailto: link is added automatically."
            pattern:
              regex: "^(mailto:)?[^\\s@]+@[^\\s@]+$"
              message: "Must be an email address (e.g. you@example.com)"

  - name: experience
    label: Service record
    type: file
    path: src/content/experience.json
    format: json
    list: true
    fields:
      - name: org
        label: Organisation
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: start
        label: Start
        type: string
        required: true
        description: YYYY-MM (or YYYY)
        pattern:
          regex: "^\\d{4}(-(0[1-9]|1[0-2]))?$"
          message: Use YYYY-MM or YYYY
      - name: end
        label: End
        type: string
        description: YYYY-MM (or YYYY). Leave blank if ongoing (shows PRESENT).
        pattern:
          regex: "^(\\d{4}(-(0[1-9]|1[0-2]))?)?$"
          message: Use YYYY-MM or YYYY, or leave blank
      - name: location
        label: Location
        type: string
        description: "e.g. SHIPLEY, UK · REMOTE"
      - name: summary
        label: Summary paragraphs
        type: text
        list: true
      - name: skills
        label: Skills acquired
        type: string
        list: true

  - name: education
    label: Education
    type: file
    path: src/content/education.json
    format: json
    list: true
    fields:
      - name: org
        label: Organisation
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: start
        label: Start
        type: string
        required: true
        description: YYYY-MM (or YYYY)
        pattern:
          regex: "^\\d{4}(-(0[1-9]|1[0-2]))?$"
          message: Use YYYY-MM or YYYY
      - name: end
        label: End
        type: string
        description: YYYY-MM (or YYYY). Leave blank if ongoing (shows PRESENT).
        pattern:
          regex: "^(\\d{4}(-(0[1-9]|1[0-2]))?)?$"
          message: Use YYYY-MM or YYYY, or leave blank
      - name: location
        label: Location
        type: string
        description: "e.g. SHIPLEY, UK · REMOTE"
      - name: summary
        label: Summary paragraphs
        type: text
        list: true
      - name: skills
        label: Skills acquired
        type: string
        list: true

  - name: skills
    label: Skills
    type: file
    path: src/content/skills.json
    format: json
    fields:
      - name: skills
        label: All skills
        type: string
        list: true
        description: Rendered in this order — put higher-priority skills first.
      - name: coreSkills
        label: Core skills
        type: string
        list: true
        description: Highlighted in amber. Should also appear in the full list.

  - name: projects
    label: Projects
    type: file
    path: src/content/projects.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Two-digit display number, e.g. 05
      - name: name
        label: Name
        type: string
        required: true
      - name: codename
        label: Codename
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: stack
        label: Stack
        type: string
        list: true
      - name: live
        label: Live URL
        type: string
        description: Leave blank to hide the live link.
      - name: fe
        label: Frontend repo URL
        type: string
        description: Leave blank to hide.
      - name: be
        label: Backend repo URL
        type: string
        description: Leave blank to hide.
      - name: preview
        label: Preview footage
        type: object
        description: Set both formats, or neither to hide the VIEW FEED button.
        fields:
          - name: webm
            label: WebM
            type: file
            options:
              path: public/videos/projects
              extensions: [webm]
          - name: mp4
            label: MP4
            type: file
            options:
              path: public/videos/projects
              extensions: [mp4]
