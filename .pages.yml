# Pages CMS configuration — https://pagescms.org/docs/configuration/
#
# Edits made at app.pagescms.org are committed straight to this repo, which
# triggers a Netlify rebuild. Every file below is validated at build time by
# src/data/portfolio.ts, so a malformed save fails the deploy instead of
# shipping a broken page.

media:
  input: public/videos
  output: /videos
  categories: [video]

content:
  - name: profile
    label: Profile
    type: file
    path: src/content/profile.json
    format: json
    fields:
      - name: operative
        label: Operative
        type: object
        required: true
        fields:
          - name: codename
            label: Codename
            type: string
            required: true
          - name: realName
            label: Real name
            type: string
            required: true
            description: Stored exactly as typed (the site uses uppercase).
          - name: role
            label: Role / headline
            type: string
            required: true
            description: Also used for the page title and meta description.
          - name: affiliation
            label: Affiliation
            type: string
            description: Current employer. Leave blank to hide it.
          - name: location
            label: Location
            type: string
            required: true
          - name: timezone
            label: Timezone
            type: select
            required: true
            description: IANA zone. The site shows its live UTC offset, so daylight saving is handled automatically.
