nodeLinker: node-modules

enableTelemetry: false

# r3f-perf (the ?perf-query diagnostic overlay) pulls in @react-three/drei@9
# and zustand@4 as transitive deps, which declare older React / r3f peer
# ranges than the project provides. Behavior is fine at runtime — npm + yarn 1
# never enforced these. Discard the resulting peer-dependency warning codes
# so `yarn install` output stays clean.
logFilters:
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard

yarnPath: .yarn/releases/yarn-4.14.1.cjs
