<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080C" />
    <meta name="color-scheme" content="dark" />

    <title>%META_TITLE%</title>
    <meta name="description" content="%META_DESCRIPTION%" />

    <meta property="og:title" content="%META_TITLE%" />
    <meta property="og:description" content="%META_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.weion.dev" />

  </head>
  <!--
    Scroll is locked here so the user can't scroll past the static
    placeholder before React mounts. BootSequence releases the lock when
    the boot animation finishes (or immediately under reduced-motion).
  -->
  <body style="overflow:hidden">
    <div id="root">
      <!--
        Static boot-screen placeholder.
        Displaying something for user's with slow connections on initial load
      -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080C;color:#FFB547;font-family:'Share Tech Mono','ui-monospace',monospace;font-size:14px;letter-spacing:0.05em">
        &gt; INITIATING REMOTE LINK ........
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
