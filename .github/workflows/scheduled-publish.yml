name: Scheduled publish

# Pages CMS can't schedule, so a save that sets "Publish at" lands on main and
# this workflow moves it into a PR (one per publish time) that it merges when
# the time comes. The cron run publishes due PRs and also re-checks main, so a
# missed push run catches up. The logic lives in scripts/scheduled-publish.mjs.
#
# Runs as a GitHub App bot when the SCHEDULER_APP_ID variable and the
# SCHEDULER_APP_PRIVATE_KEY secret are set (app needs Contents, Pull requests
# and Issues: read and write). Otherwise it falls back to github-actions[bot],
# which needs "Allow GitHub Actions to create and approve pull requests" on.
on:
  push:
    branches: [main]
    paths: ['src/content/**']
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Serialized: every run reads and rewrites main and the scheduled/* branches.
concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint bot token
        id: app
        if: vars.SCHEDULER_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCHEDULER_APP_ID }}
          private-key: ${{ secrets.SCHEDULER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Configure bot identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            name="${APP_SLUG}[bot]"
            id=$(gh api "/users/${name}" --jq .id)
          else
            name='github-actions[bot]'
            id=41898282
          fi
          git config user.name "$name"
          git config user.email "${id}+${name}@users.noreply.github.com"

      - name: Publish due PRs and hold new scheduled edits
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          USING_APP_TOKEN: ${{ steps.app.outputs.token != '' }}
        run: node scripts/scheduled-publish.mjs run
