[build]
  command = "yarn build"
  publish = "dist"
  # Exit 0 skips the build: a Pages CMS save with a future "Publish at" must
  # not go live before scripts/scheduled-publish.mjs moves it into its PR.
  ignore = "node scripts/scheduled-publish.mjs netlify-ignore"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "sameorigin"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'self'; script-src 'self' d33wubrfki0l68.cloudfront.net 'report-sample' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' d33wubrfki0l68.cloudfront.net 'report-sample' cdn.jsdelivr.net; object-src 'self'; frame-src 'self'; img-src 'self' *.netlify.com badges.netlify.app cdn.jsdelivr.net d33wubrfki0l68.cloudfront.net; font-src 'self' cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; connect-src 'self' cdn.jsdelivr.net; media-src 'self' d33wubrfki0l68.cloudfront.net;"
    Permissions-Policy = "camera=(), fullscreen=(self), geolocation=(), microphone=()"


# Redirect Netlify.app to weion.dev domain.
[[redirects]]
  from = "https://weion.netlify.app"
  to = "https://weion.dev"
  status = 301
  force = true
