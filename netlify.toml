[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "sameorigin"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'self'; script-src 'self' d33wubrfki0l68.cloudfront.net 'report-sample' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' d33wubrfki0l68.cloudfront.net 'report-sample' cdn.jsdelivr.net; object-src 'self' wakatime.com; frame-src 'self' wakatime.com; img-src 'self' wakatime.com *.netlify.com badges.netlify.app cdn.jsdelivr.net d33wubrfki0l68.cloudfront.net; font-src 'self' cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; connect-src 'self' cdn.jsdelivr.net wakatime.com; media-src 'self' d33wubrfki0l68.cloudfront.net;"
    Permissions-Policy = "camera=(), fullscreen=(self), geolocation=(), microphone=()"


# Redirect Netlify.app to weion.dev domain.
[[redirects]]
  from = "https://weion.netlify.app"
  to = "https://weion.dev"
  status = 301
  force = true
